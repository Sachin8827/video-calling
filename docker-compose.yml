services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: comms_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-comms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comms_pass}
      POSTGRES_DB:       ${POSTGRES_DB:-comms_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comms_user} -d ${POSTGRES_DB:-comms_db}"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: comms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── coturn (TURN server — free, self-hosted) ───────────────────────────────
  coturn:
    image: coturn/coturn:latest
    container_name: comms_coturn
    restart: unless-stopped
    network_mode: host   # Required for UDP media relay
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: -c /etc/coturn/turnserver.conf

  # ── NestJS Backend ─────────────────────────────────────────────────────────
  # Uses node:20-bookworm (GCC 12) so MediaSoup compiles
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comms_api
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV:              development
      DATABASE_URL:          postgresql://${POSTGRES_USER:-comms_user}:${POSTGRES_PASSWORD:-comms_pass}@postgres:5432/${POSTGRES_DB:-comms_db}
      REDIS_URL:             redis://redis:6379
      JWT_SECRET:            ${JWT_SECRET}
      JWT_ACCESS_EXPIRY:     ${JWT_ACCESS_EXPIRY:-15m}
      ALLOWED_ORIGIN:        ${ALLOWED_ORIGIN:-http://localhost:3001}
      TURN_SERVER_URL:       ${TURN_SERVER_URL}
      TURN_USERNAME:         ${TURN_USERNAME}
      TURN_CREDENTIAL:       ${TURN_CREDENTIAL}
      MEDIASOUP_LISTEN_IP:   0.0.0.0
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:-127.0.0.1}
      MEDIASOUP_MIN_PORT:    40000
      MEDIASOUP_MAX_PORT:    40099
    ports:
      - "3000:3000"
      - "40000-40099:40000-40099/udp"   # MediaSoup RTC ports
    depends_on:
      - postgres
      - redis

  # ── Next.js Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: comms_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3000/signal
    ports:
      - "3001:3001"
    depends_on:
      - api

  # ── Nginx Dev Proxy ────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: comms_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend

volumes:
  postgres_data:
  redis_data:
