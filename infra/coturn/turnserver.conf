# coturn TURN server configuration
# Self-hosted, zero licensing cost
# Docs: https://github.com/coturn/coturn/wiki/turnserver

listening-port=3478
tls-listening-port=5349

# Replace with your server's public IP
# external-ip=YOUR_PUBLIC_IP

# Credentials — must match TURN_USERNAME and TURN_CREDENTIAL in .env
user=turnuser:turnpassword

# Realm (typically your domain)
realm=comms.local

# Log to stdout (Docker-friendly)
log-file=stdout
no-stdout-log

# Security
fingerprint
lt-cred-mech
no-cli
no-loopback-peers
no-multicast-peers

# Deny relay to private IP ranges (security best practice)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255

# Quota per user — prevent abuse
user-quota=12
total-quota=1200
